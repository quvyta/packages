[package]
name = "quvyta-packages"
description = "One simple place for pacman, AUR, Flatpak and Snap packages, in the terminal (beta)"
repository = "https://github.com/quvyta/packages"
readme = "../../README.md"
keywords = ["tui", "terminal", "pacman", "arch", "packages"]
categories = ["command-line-utilities"]
version = "0.1.5"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# Only what the program is built from goes into the package; the rest of the repository is for
# working on it.
include = ["src/**", "assets/**", "Cargo.toml", "README.md", "LICENSE"]

[[bin]]
name = "qpac"
path = "src/bin/qpac.rs"

[[bin]]
name = "quvyta-packages"
path = "src/bin/quvyta-packages.rs"

[dependencies]
quvyta-packages-core = { version = "0.1.3", path = "../qpackages-core" }
quvyta-framework = "0.1.7"

[lints]
workspace = true

