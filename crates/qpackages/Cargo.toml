[package]
name = "quvyta-packages"
description = "One simple place for pacman, AUR, Flatpak and Snap packages, in the terminal (beta)"
repository = "https://github.com/quvyta/packages"
readme = "../../README.md"
keywords = ["tui", "terminal", "pacman", "arch", "packages"]
categories = ["command-line-utilities"]
version = "0.1.12"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# Only what the program is built from goes into the package; the rest of the repository is for
# working on it.
include = ["/src/**", "/assets/**", "/Cargo.toml", "/README.md", "/LICENSE"]

[[bin]]
name = "qpac"
path = "src/bin/qpac.rs"

[[bin]]
name = "quvyta-packages"
path = "src/bin/quvyta-packages.rs"

[dependencies]
quvyta-packages-core = { version = "0.1.8", path = "../qpackages-core" }
# `updates` is the ecosystem's once-a-day question whether a newer qpac is out.
quvyta-framework = { version = "0.1.21", features = ["updates"] }
# Already built for the framework; used directly for the pipes an AUR build's root steps travel
# through, which the standard library cannot make (`mkfifo`) or open without blocking.
rustix = { version = "1.1.4", default-features = false, features = ["std", "fs", "event"] }

[lints]
workspace = true

[dev-dependencies]
# The language checks read the files themselves rather than the loaded catalogue, so a key a
# translation quietly borrows from English still counts as missing.
toml = { version = "1.1.6", default-features = false, features = ["std", "parse"] }
